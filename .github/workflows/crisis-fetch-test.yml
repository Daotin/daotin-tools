name: 金融危机预警取数测试

on:
  push:
    branches:
      - feat/crisis-warning
    paths:
      - 'crisis/**'
      - '.github/workflows/crisis-fetch-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: crisis/requirements.txt
      - run: pip install -r crisis/requirements.txt
      - run: python -m unittest discover -s crisis/tests -v
      - run: python crisis/pipeline/run.py
      - name: 查看改动
        if: always()
        run: git status --short
